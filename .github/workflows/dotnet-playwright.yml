name: .NET & Playwright CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-$(hashFiles('**/*.csproj'))
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore solution packages
        run: dotnet restore

      - name: Ensure Microsoft.Playwright package is referenced in test project(s)
        run: |
          # Adjust the path(s) below if your Playwright test project(s) are located elsewhere.
          # This will add the package if missing (use the project that needs Microsoft.Playwright).
          dotnet add tests/Saucedemo.PlaywrightTests/Saucedemo.PlaywrightTests.csproj package Microsoft.Playwright --version 1.55.0

      - name: Build solution (Playwright package must be present / built before CLI installs browsers)
        run: dotnet build --configuration Release --no-restore

      - name: Install or update Playwright CLI (dotnet tool)
        run: |
          dotnet tool install --global Microsoft.Playwright.CLI || dotnet tool update --global Microsoft.Playwright.CLI

      - name: Make dotnet tools available to PATH (supported method)
        run: echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH

      - name: Install Playwright browsers
        run: playwright install --with-deps

      - name: Run tests
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
